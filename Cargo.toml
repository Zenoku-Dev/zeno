[package]
name = "zeno"
version = "0.5.0"
edition = "2021"
description = "zeno — локальный аналог VirusTotal с открытым кодом: хэши, проверки по открытым базам и сканирование открытыми AV-движками (ClamAV, YARA-X)"
license = "MIT"
repository = "https://github.com/rival-afk/zeno"
keywords = ["antivirus", "clamav", "yara", "security", "scanner"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json", "rustls-tls", "multipart"], default-features = false }
walkdir = "2"
toml = "0.8"
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.release]
lto = true
strip = true
