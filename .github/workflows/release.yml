name: release

# Публикует релизы по тегу v*:
#   git tag v0.4.0 && git push origin v0.4.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: 0
  # для кросс-компиляции aarch64-unknown-linux-gnu
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu   # glibc >= 2.35, кросс gcc ниже
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13                # Intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cross target (linux/macos)
        if: matrix.os != 'windows-latest'
        run: |
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-musl" ]; then
            sudo apt-get update -y && sudo apt-get install -y musl-tools
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get update -y && sudo apt-get install -y gcc-aarch64-linux-gnu
          fi
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $stage = "zeno-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/zeno.exe" $stage
          Copy-Item "README.md","LICENSE","zeno.toml.example" $stage
          Compress-Archive -Path $stage -DestinationPath "${stage}.zip"

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          stage="zeno-${{ matrix.target }}"
          mkdir "$stage"
          cp "target/${{ matrix.target }}/release/zeno" "$stage/"
          cp README.md LICENSE zeno.toml.example "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zeno-${{ matrix.target }}
          path: |
            zeno-x86_64-pc-windows-msvc.zip
            zeno-x86_64-unknown-linux-musl.tar.gz
            zeno-aarch64-unknown-linux-gnu.tar.gz
            zeno-aarch64-apple-darwin.tar.gz
            zeno-x86_64-apple-darwin.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # нужен gh, чтобы определить репозиторий и сгенерировать notes

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            artifacts/zeno-x86_64-pc-windows-msvc.zip \
            artifacts/zeno-x86_64-unknown-linux-musl.tar.gz \
            artifacts/zeno-aarch64-unknown-linux-gnu.tar.gz \
            artifacts/zeno-aarch64-apple-darwin.tar.gz \
            artifacts/zeno-x86_64-apple-darwin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
